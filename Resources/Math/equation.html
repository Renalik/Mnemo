<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; img-src 'none'"><link rel="stylesheet" href="katex.min.css"><script src="katex.min.js"></script><style>body{margin:0;padding:12px;display:flex;align-items:center;justify-content:center;min-height:60px;background:transparent}#equation{max-width:100%;overflow:auto}.katex{font-size:1.3em}</style></head><body><div id="equation" role="math"></div><script>window.renderEquation=function(value){document.body.style.color=value.dark?'#fff':'#000';try{katex.render(value.formula,document.getElementById('equation'),{displayMode:true,throwOnError:false,trust:false,maxExpand:1000,maxSize:15,strict:'warn'})}catch(error){document.getElementById('equation').textContent=value.formula}}</script></body></html>
