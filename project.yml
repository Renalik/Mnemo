name: Mnemo
options:
  bundleIdPrefix: app.renalik
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
  developmentLanguage: ru
  knownRegions: [ru, en, Base]
packages:
  MnemoCore:
    path: .
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    MARKETING_VERSION: '1.3.0'
    CURRENT_PROJECT_VERSION: '4'
    CODE_SIGNING_ALLOWED: NO
    'CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]': YES
    'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
targets:
  Mnemo:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/Math
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: MnemoCore
        product: MnemoCore
      - package: MnemoCore
        product: CZstd
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.renalik.mnemo
        INFOPLIST_FILE: Config/App-Info.plist
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Config/Simulator.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  MnemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    dependencies:
      - target: Mnemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MnemoIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/IntegrationTests
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Mnemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mnemo:
    build:
      targets:
        Mnemo: all
    test:
      targets: [MnemoIntegrationTests, MnemoUITests]
